services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-task-app:local
    container_name: devops-task-app
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      APP_ENV: "local"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
